{% extends "base.html" %}{% block body %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% if debug %}<p class="ok">{{ debug }}</p>{% endif %}
<form method="post" action="/verify"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<label>Enter the 6-digit code <input type="text" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></label>
<button>Verify</button></form>
<form method="post" action="/send-code"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button>Resend code</button></form>
{% endblock %}
