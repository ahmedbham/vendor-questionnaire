{% extends "base.html" %}{% block body %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<p><label>Password <input type="password" name="password" required></label></p>
<p><label>Authenticator code (if enabled) <input type="text" name="totp" inputmode="numeric"></label></p>
<button>Admin sign in</button></form>
{% endblock %}
